[env:base]
platform = espressif32
board = mhetesp32minikit
framework = arduino

custom_name = esp32-minikit
custom_password = iotempower
monitor_speed = 115200

lib_deps = 
    knolleary/PubSubClient
    plerup/EspSoftwareSerial@^8.2.0

build_flags =
    -D ECL_SERIAL_SPEED=${this.monitor_speed}
    -D ECL_WIFI_SSID=\"IOT15\"
    -D ECL_WIFI_PASSWORD=\"iotempire\"
    -D ECL_TELNET_PORT=23

[env:minikitA]
extends = env:base
custom_name = ${env:base.custom_name}A
build_flags =
    ${env:base.build_flags}
    -D ECL_OTA_HOSTNAME=\"${this.custom_name}\"
    -D ECL_OTA_PASSWORD=\"${this.custom_password}\"
    -D ECL_MQTT_CLIENT=\"${this.custom_name}\"

[env:minikitB]
extends = env:base
custom_name = ${env:base.custom_name}B
build_flags =
    ${env:base.build_flags}
    -D ECL_OTA_HOSTNAME=\"${this.custom_name}\"
    -D ECL_OTA_PASSWORD=\"${this.custom_password}\"
    -D ECL_MQTT_CLIENT=\"${this.custom_name}\"

[env:minikitA_usb]
extends = env:minikitA, env:usb
upload_port = COM8
monitor_port = COM8

[env:minikitA_ota]
extends = env:minikitA
upload_protocol = espota
upload_port = ${this.custom_name}.local
upload_flags = --auth=${this.custom_password}

[env:minikitB_usb]
extends = env:minikitB, env:usb
upload_port = COM8
monitor_port = COM8

[env:minikitB_ota]
extends = env:minikitB
upload_protocol = espota
upload_port = ${this.custom_name}.local
upload_flags = --auth=${this.custom_password}
