; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:base]
framework = arduino
monitor_speed = 115200
lib_deps = 
	adafruit/Adafruit NeoPixel
	MFRC522
	OneWire
	DallasTemperature
	Adafruit MPR121@1.1.3
	bertmelis/espMqttClient@^1.7.2
	PubSubClient
	u8g2
	espSoftwareSerial
	teckel12/NewPing@^1.9.7

custom_password = iotempower
build_flags = 
	-D ECL_SERIAL_SPEED=${this.monitor_speed}
	-D ECL_WIFI_SSID=\"IOT15\"
	-D ECL_WIFI_PASSWORD=\"iotempire\"
	-D ECL_TELNET_PORT=23
	-D ECL_MQTT_SERVER=\"192.168.14.1\"
	-D ECL_custom_password=\"${this.custom_password}\"

[env:setup32] # flashes a 32 via wire
extends = env:base
custom_name = esp32-minikitA
build_flags = 
	${env:base.build_flags}
	-D ECL_OTA_HOSTNAME=\"${this.custom_name}\"
build_src_filter = 
	-<*>
	+<ota/>
upload_port = /dev/cu.usbserial-52870161791
platform = espressif32
board = mhetesp32minikit

[env:ota32] # flashes a 32 via OTA
custom_name = esp32-minikitB
extends = env:setup32
upload_protocol = espota
upload_port = ${this.custom_name}.local
build_flags = 
	${env:base.build_flags}
	-D ECL_OTA_HOSTNAME=\"${this.custom_name}\"
	-D ECL_MQTT_CLIENT=\"${this.custom_name}\"
upload_flags = --auth=${this.custom_password}
build_src_filter = 
	-<*>
	+<module04-2/task02-rgb/>

[env:setup8266] # flashes an 8266 via wire
extends = env:base
custom_name = d1-miniD
build_flags = 
	${env:base.build_flags}
	-D ECL_OTA_HOSTNAME=\"${this.custom_name}\"
build_src_filter = 
	-<*>
	+<module05/rfid/>
upload_port = /dev/cu.usbserial-130
platform = espressif8266
board = d1_mini

[env:ota8266] # flashes an 8266 via OTA
custom_name = d1-miniD
extends = env:setup8266
upload_protocol = espota
upload_port = ${this.custom_name}.local
upload_flags = --auth=${this.custom_password}
build_flags = 
	${env:base.build_flags}
	-D ECL_OTA_HOSTNAME=\"${this.custom_name}\"
	-D ECL_MQTT_CLIENT=\"${this.custom_name}\"

build_src_filter = 
	-<*>
	+<module04-2/task02-rfid/>