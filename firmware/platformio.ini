; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:base]
framework = arduino
monitor_speed = 115200
lib_deps = 
	adafruit/Adafruit NeoPixel
	MFRC522
	OneWire
	DallasTemperature
	Adafruit MPR121@1.1.3
	bertmelis/espMqttClient@^1.7.2
	PubSubClient
	u8g2
	espSoftwareSerial
	teckel12/NewPing@^1.9.7
	bblanchon/ArduinoJson@^7.2.2
custom_password = iotempower
build_flags = 
	-D ECL_SERIAL_SPEED=${this.monitor_speed}
	-D ECL_WIFI_SSID=\"IOT15\"
	-D ECL_WIFI_PASSWORD=\"iotempire\"
	-D ECL_TELNET_PORT=23
	-D ECL_MQTT_SERVER=\"192.168.14.1\"
	-D ECL_custom_password=\"${this.custom_password}\"

[env:setup32]
extends = env:base
custom_name = esp32-minikitA
build_flags = 
	${env:base.build_flags}
	-D ECL_OTA_HOSTNAME=\"${this.custom_name}\"
build_src_filter = 
	-<*>
	+<ota/>
upload_port = /dev/cu.usbserial-52870140141
platform = espressif32
board = mhetesp32minikit

[env:ota32]
custom_name = esp32-minikitA
extends = env:setup32
upload_protocol = espota
upload_port = ${this.custom_name}.local
build_flags = 
	${env:base.build_flags}
	-D ECL_OTA_HOSTNAME=\"${this.custom_name}\"
	-D ECL_MQTT_CLIENT=\"${this.custom_name}\"
upload_flags = --auth=${this.custom_password}
build_src_filter = 
	-<*>
	+<access-esp>

[env:setup8266]
extends = env:base
custom_name = d1-miniD
build_flags = 
	${env:base.build_flags}
	-D ECL_OTA_HOSTNAME=\"${this.custom_name}\"
build_src_filter = 
	-<*>
	+<ota/>
upload_port = /dev/cu.usbserial-130
platform = espressif8266
board = d1_mini

[env:ota8266]
custom_name = d1-miniD
extends = env:setup8266
upload_protocol = espota
upload_port = ${this.custom_name}.local
upload_flags = --auth=${this.custom_password}
build_flags = 
	${env:base.build_flags}
	-D ECL_OTA_HOSTNAME=\"${this.custom_name}\"
	-D ECL_MQTT_CLIENT=\"${this.custom_name}\"
build_src_filter = 
	-<*>
	+<bike-detection/>

[env:access-esp]
extends = env:ota32
custom_name = Delta
custom_lat = 58.3776
custom_lon = 26.7290

build_flags = 
	${env:base.build_flags}
	${env:ota32.build_flags}
	-D STATION_NAME=\"${this.custom_name}\"
	-D LATITUDE=\"${this.custom_lat}\"
	-D LONGITUDE=\"${this.custom_lon}\"

build_src_filter = 
	-<*>
	+<access-esp/>

[env:bike-detection]
extends = env:ota8266
custom_space_id = 0

build_flags = 
	${env:base.build_flags}
	${env:ota8266.build_flags}
	-D SPACE_ID=\"${this.custom_space_id}\"

build_src_filter = 
	-<*>
	+<bike-detection/>

[env:setup-rfid]
extends = env:base
custom_name = esp32-rfid
build_flags =
	${env:base.build_flags}
	-D ECL_OTA_HOSTNAME=\"${this.custom_name}\"
build_src_filter =
	-<*>
	+<ota/>
platform = espressif32
board = mhetesp32minikit

[env:rfid]
extends = env:setup-rfid
custom_space_id = 0
upload_protocol = espota
upload_port = ${this.custom_name}.local
upload_flags = --auth=${this.custom_password}
build_flags =
	${env:base.build_flags}
	-D ECL_OTA_HOSTNAME=\"${this.custom_name}\"
	-D ECL_MQTT_CLIENT=\"${this.custom_name}\"
	-D SPACE_ID=\"${this.custom_space_id}\"

build_src_filter =
	-<*>
	+<rfid/>

[env:solenoid-lock]
extends = env:ota8266
custom_space_id = 0

build_flags = 
	${env:base.build_flags}
	${env:ota8266.build_flags}
	-D SPACE_ID=\"${this.custom_space_id}\"

build_src_filter = 
	-<*>
	+<solenoid-lock/>