services:
  backend:
    build: ./backend
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./backend/data:/data
    ports:
      - "127.0.0.1:10000:5000"
    command: gunicorn --bind 0.0.0.0:5000 --workers 1 --threads 8 --timeout 60 app:app
    restart: unless-stopped

  frontend:
    build: ./frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "127.0.0.1:10001:5000"
    command: gunicorn --bind 0.0.0.0:5000 --workers 2 --threads 4 --timeout 60 app:app
    depends_on:
      - backend
    restart: unless-stopped
