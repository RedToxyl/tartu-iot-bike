version: '3.8'

services:
  web:
    build: .
    working_dir: /app
    volumes:
      - .:/app
      - ./data:/data
    ports:
      - "80:5000"
    command: flask --app app.py --debug run --host=0.0.0.0 --port=5000
    environment:
      - FLASK_DEBUG=1  # Required for debug mode
      - FLASK_APP=app.py       # Required to specify the app